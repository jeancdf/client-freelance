# Vérifications sur chaque poussée et chaque pull request.
# Le déploiement rejoue ces mêmes étapes avant de toucher au VPS.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verifier:
    name: Types, tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Le serveur s'appuie sur l'effacement natif des types, disponible à
      # partir de Node 22.18 : la CI doit tourner sur la même base.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Vérifier les types (front, serveur, outils)
        run: npm run typecheck

      - name: Tests du serveur
        run: npm test

      - name: Build du front
        run: npm run build

  image:
    name: Build de l'image Docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Construit l'image sans la pousser : une erreur de Dockerfile est vue
      # ici plutôt qu'au moment du déploiement sur le VPS.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
