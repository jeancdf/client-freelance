# Déploiement sur le VPS OVH à chaque poussée sur main (ou manuellement).
#
# Même motif que les autres projets du VPS : la CI checkout sur le runner, rsync
# vers ~/client-freelance/releases/<sha>, bascule le symlink `current`, puis
# relance la stack. Le TLS et le routage restent à la charge du Caddy mutualisé
# (stack `qr-code`) : rien ici ne touche à sa configuration.
#
# Secrets requis : VPS_HOST, VPS_USER, VPS_SSH_PRIVATE_KEY.
# Le fichier ~/client-freelance/shared/.env (CADRAGE_ADMIN_TOKEN) est copié
# dans chaque release avant le démarrage ; il n'est jamais dans le dépôt.

name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  APP_DIR: /home/deploy/client-freelance
  SITE: https://client-contact.duckdns.org

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Les mêmes vérifications que la CI : main ne part sur le VPS que si
      # les types passent et que les tests du serveur sont verts.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Préparer la connexion SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Préparer l'arborescence
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p '${APP_DIR}/releases' '${APP_DIR}/shared'"

      - name: Envoyer la release
        run: |
          rsync -az --delete --exclude '.git' \
            -e "ssh -i ~/.ssh/id_deploy" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${APP_DIR}/releases/${{ github.sha }}/"

      - name: Activer la release et relancer la stack
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            APP_DIR="${APP_DIR}" RELEASE_SHA="${{ github.sha }}" 'bash -s' <<'EOF'
          set -euo pipefail
          RELEASE="$APP_DIR/releases/$RELEASE_SHA"

          if [ ! -f "$APP_DIR/shared/.env" ]; then
            echo "::error::$APP_DIR/shared/.env manquant (CADRAGE_ADMIN_TOKEN)." >&2
            exit 1
          fi
          cp "$APP_DIR/shared/.env" "$RELEASE/.env"

          ln -sfn "$RELEASE" "$APP_DIR/current"
          cd "$APP_DIR/current"

          docker compose -f docker-compose.prod.yml up -d --build
          docker image prune -f

          # Garder les cinq dernières releases.
          ls -1dt "$APP_DIR"/releases/* | tail -n +6 | xargs -r rm -rf

          docker compose -f docker-compose.prod.yml ps
          EOF

      - name: Vérifier que le site répond
        run: |
          for essai in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "${SITE}/api/sante" || true)
            if [ "$code" = "200" ]; then
              echo "::notice::Déployé sur ${SITE}"
              exit 0
            fi
            echo "Tentative $essai : HTTP $code — nouvel essai dans 10 s"
            sleep 10
          done
          echo "::error::${SITE} ne répond pas après le déploiement."
          exit 1
